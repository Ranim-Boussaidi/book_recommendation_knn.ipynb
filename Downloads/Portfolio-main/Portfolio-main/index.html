<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranim Boussaidi - Portfolio</title>


    <script src="https://cdn.tailwindcss.com"></script>


    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>


    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .skill-bar {
            transition: width 1.5s ease-in-out;
            position: relative;
        }

        .skill-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-slideInLeft {
            animation: slideInLeft 0.8s ease-out forwards;
        }

        .animate-slideInRight {
            animation: slideInRight 0.8s ease-out forwards;
        }

        .typing-animation {
            border-right: 2px solid white;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            50% {
                border-color: white;
            }

            51%,
            100% {
                border-color: transparent;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
            }

            50% {
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.8), 0 0 30px rgba(102, 126, 234, 0.6);
            }
        }

        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            40% {
                transform: translateX(-50%) translateY(-10px);
            }

            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }


        .parallax-bg {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }


        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }


        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .slide-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.8s ease-out;
        }

        .slide-left.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .slide-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s ease-out;
        }

        .slide-right.visible {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;


        const useIntersectionObserver = (options = {}) => {
            const [isIntersecting, setIsIntersecting] = useState(false);
            const ref = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        setIsIntersecting(entry.isIntersecting);
                    },
                    {
                        threshold: 0.1,
                        ...options,
                    }
                );

                if (ref.current) {
                    observer.observe(ref.current);
                }

                return () => {
                    observer.disconnect();
                };
            }, []);

            return [ref, isIntersecting];
        };


        const Header = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            return (
                <header className="gradient-bg text-white sticky top-0 z-50 shadow-lg">
                    <div className="container mx-auto px-4 py-4">
                        <div className="flex justify-between items-center">
                            <h1 className="text-2xl font-bold">Ranim Boussaidi</h1>


                            <nav className="hidden md:flex space-x-6">
                                <a href="#home" className="hover:text-purple-200 transition-colors">Accueil</a>
                                <a href="#about" className="hover:text-purple-200 transition-colors">À propos</a>
                                <a href="#education" className="hover:text-purple-200 transition-colors">Formation</a>
                                <a href="#experience" className="hover:text-purple-200 transition-colors">Expérience</a>
                                <a href="#skills" className="hover:text-purple-200 transition-colors">Compétences</a>
                                <a href="#projects" className="hover:text-purple-200 transition-colors">Projets</a>
                                <a href="#certifications" className="hover:text-purple-200 transition-colors">Certifications</a>
                            </nav>


                            <button
                                className="md:hidden"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <i className="fas fa-bars text-xl"></i>
                            </button>
                        </div>


                        {isMenuOpen && (
                            <nav className="md:hidden mt-4 pb-4">
                                <div className="flex flex-col space-y-2">
                                    <a href="#home" className="hover:text-purple-200 transition-colors py-2">Accueil</a>
                                    <a href="#about" className="hover:text-purple-200 transition-colors py-2">À propos</a>
                                    <a href="#education" className="hover:text-purple-200 transition-colors py-2">Formation</a>
                                    <a href="#experience" className="hover:text-purple-200 transition-colors py-2">Expérience</a>
                                    <a href="#skills" className="hover:text-purple-200 transition-colors py-2">Compétences</a>
                                    <a href="#projects" className="hover:text-purple-200 transition-colors py-2">Projets</a>
                                    <a href="#certifications" className="hover:text-purple-200 transition-colors py-2">Certifications</a>
                                </div>
                            </nav>
                        )}
                    </div>

            );
        };


        const HeroSection = () => {

            const texts = [

            useEffect(() => {

                                Passionnée par le développement web et mobile, je suis actuellement étudiante en
                                Technologie de l'Informatique, spécialisée en développement des systèmes d'information.
                            </p>

                    </div>

        const AboutSection = () => {

            return (

                            <h2 className="text-4xl font-bold text-gray-800 mb-4">À propos de moi</h2>
                            <div className="w-20 h-1 bg-purple-600 mx-auto"></div>
                        </div>

                        <div className="max-w-4xl mx-auto">
                            <div className={`bg-white rounded-lg shadow-lg p-8 card-hover fade-in ${isIntersecting ? 'visible' : ''}`} style={{ transitionDelay: '0.2s' }}>

                                            Je suis une étudiante passionnée par le monde du développement web et mobile.
                                            Actuellement en formation à l'ISET Jendouba, je me spécialise dans le
                                            développement des systèmes d'information.

                                        <p className="text-gray-600 mb-6 leading-relaxed">

                                            front-end et back-end, ainsi qu'une expérience pratique grâce à mes stages
                                            professionnels.
                                        </p>

                                        <div className="grid grid-cols-2 gap-4 text-center">
                                            <div className="bg-purple-50 p-4 rounded-lg hover:bg-purple-100 transition-colors duration-300">
                                                <div className="text-2xl font-bold text-purple-600 counter" data-target="2">3</div>
                                                <div className="text-gray-600">Années d'études</div>
                                            </div>
                                            <div className="bg-purple-50 p-4 rounded-lg hover:bg-purple-100 transition-colors duration-300">
                                                <div className="text-2xl font-bold text-purple-600 counter" data-target="2">3</div>
                                                <div className="text-gray-600">Stages réalisés</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };


        const EducationSection = () => {
            const education = [
                {
                    year: "2023 - 2026",
                    degree: "Technologie de l'Informatique",
                    school: "ISET Jendouba",
                    specialization: "Développement des Systèmes d'Information",
                    icon: "fas fa-graduation-cap"

                {
                    year: "2022 - 2023",

                }
            ];

                            <h2 className="text-4xl font-bold text-gray-800 mb-4">Formation</h2>

                        <div className="max-w-4xl mx-auto">

                    icon: "fas fa-calendar-check"

                {

                },
                {

                    company: "BNA",

                }

            return (

                    <div className="container mx-auto px-4">

                            <div className="space-y-8">
                                {experiences.map((exp, index) => (
                                    <div key={index} className="bg-white rounded-lg shadow-lg p-6 card-hover">
                                        <div className="flex items-start space-x-4">
                                            <div className="bg-purple-100 p-3 rounded-full">
                                                <i className={`${exp.icon} text-purple-600 text-xl`}></i>
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex flex-col md:flex-row md:justify-between md:items-start mb-4">
                                                    <div>
                                                        <h3 className="text-xl font-semibold text-gray-800">{exp.title}</h3>

                                                <div className="flex flex-wrap gap-2">
